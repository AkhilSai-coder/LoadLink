services:
  - type: web
    name: routefill-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: routefill-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:8000"

databases:
  - name: routefill-db
    plan: free
