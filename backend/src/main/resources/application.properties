# ================================================================
#  ROUTEFILL Backend - application.properties
#  Road Transportation and Logistics Platform
# ================================================================
spring.application.name=routefill-backend
server.port=${PORT:8080}

# --- PostgreSQL Datasource (Cloud / Local Flexible) ---
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/routefill}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:akhil1101}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- Spring Data JPA & Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# --- JWT Configuration ---
routefill.app.jwtSecret=${JWT_SECRET:Um91dGVmaWxsU21hcnRCYWNraGF1bExvZ2lzdGljc1BsYXRmb3JtSldUU2VjcmV0S2V5MjAyNg==}
routefill.app.jwtExpirationMs=86400000

# --- CORS Configuration (Supports local + Vercel) ---
routefill.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080,https://*.vercel.app}

# --- Logging ---
logging.level.com.routefill=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
